<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Trello Power-Up client library. Nothing else loads here: this hidden
       iframe runs on every card, so it stays tiny. The DYMO SDK and print
       logic load only in the popups, when a print is actually requested. -->
  <script src="https://p.trello.com/power-up.min.js"></script>
</head>
<body>
<script>
/*
 * Hidden "connector" iframe Trello loads on every card. Registers two card
 * buttons; each opens a popup that does the real work:
 *   1) Archive Label -> popup-archive.html (prints immediately on open)
 *   2) Box Labels    -> popup-box.html     (asks for a box count first)
 */

// Inline data-URI icon: must be an absolute URL or Trello silently drops the
// button. assets/icon.svg is used for the Power-Up listing, not here.
var ICON = 'data:image/svg+xml;base64,' + btoa(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
  '<path fill="#5e6c84" d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59' +
  'a2 2 0 0 0 .59 1.41l9.59 9.59a2 2 0 0 0 2.83 0l4.58-4.58a2 2 0 0 0 0-2.83zM7 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>' +
  '</svg>'
);

TrelloPowerUp.initialize({
  'card-buttons': function (t) {
    return [
      {
        icon: ICON,
        text: 'Archive Label',
        callback: function (t) {
          return t.popup({
            title: 'Archive Label',
            url: 'popup-archive.html',
            height: 130
          });
        }
      },
      {
        icon: ICON,
        text: 'Box Labels',
        callback: function (t) {
          return t.popup({
            title: 'Print Box Labels',
            url: 'popup-box.html',
            height: 200
          });
        }
      }
    ];
  }
});
</script>
</body>
</html>
