<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://p.trello.com/power-up.min.js"></script>
  <link rel="stylesheet" href="https://p.trello.com/power-up.min.css">
  <script src="vendor/dymo.connect.framework.js"></script>
  <script src="card-title.js"></script>
  <script src="dymo-print.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 12px; }
    label { display: block; font-size: 12px; color: #5e6c84; margin-bottom: 4px; }
    input[type=number] { width: 100%; font-size: 20px; padding: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 12px; padding: 8px; font-size: 14px; }
    #status { margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <label for="qty">Number of boxes</label>
  <input type="number" id="qty" min="1" step="1" value="1" autofocus>
  <button id="printBtn">Print Box Labels</button>
  <div id="status"></div>

  <script src="popup-box.js"></script>
</body>
</html>
